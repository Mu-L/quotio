name: iOS checks
on:
  pull_request:
    paths: ['apps/ios/**', 'Packages/QuotioHostClient/**', '.github/workflows/ios-ci.yml']
  push:
    branches: [master]
    paths: ['apps/ios/**', 'Packages/QuotioHostClient/**', '.github/workflows/ios-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Test connection and presentation models
        run: |
          swift test --package-path Packages/QuotioHostClient
          swift test --package-path apps/ios
      - name: Build app and widget and test navigation
        run: |
          simulator_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for runtime, devices in d["devices"].items() if "iOS-26" in runtime for x in devices if x["name"].startswith("iPhone")))')
          xcodebuild -project apps/ios/Quotio.xcodeproj -scheme QuotioIOS -destination "platform=iOS Simulator,id=$simulator_id" -resultBundlePath /tmp/QuotioIOS.xcresult test CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ios-test-results
          path: /tmp/QuotioIOS.xcresult
          if-no-files-found: ignore
